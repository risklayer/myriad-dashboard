{% load crispy_forms_tags %}
{% load static %}

<details class="curve-filter-details" open>
  <summary>
    <h3 class="d-inline-block h5 mb-3">
      <span>Dataset filter</span>
      <svg width="24" height="24" fill="currentColor" class="me-1">
        <use xlink:href="{% static "bootstrap-icons/bootstrap-icons.svg" %}#filter" />
      </svg>
    </h3>
  </summary>
  <form method="post"
        class="curve-filter-form"
        hx-post="{% url 'curve_editor:filter_curves' %}"
        hx-trigger="change"
        hx-swap="outerHTML"
        hx-select="#id_panel_{{ panel }}_row"
        hx-target="#id_panel_{{ panel }}_row"
        hx-include="#id_panel_{{ panel }}_row"
        hx-indicator="#panel-{{ panel }} .htmx-indicator"
        enctype="multipart/form-data"
        novalidate>
    {% crispy filter_form %}
    <button type="button"
            class="btn btn-outline-secondary float-end me-2"
            onclick="copyFilters({{ panel }})">
      {% if panel == 2 %}
        <svg width="16" height="16" fill="currentColor" class="me-1">
          <use xlink:href="{% static "bootstrap-icons/bootstrap-icons.svg" %}#arrow-left" />
        </svg>
      {% endif %}
      Copy filters
      {% if panel == 1 %}
        <svg width="16" height="16" fill="currentColor" class="me-1">
          <use xlink:href="{% static "bootstrap-icons/bootstrap-icons.svg" %}#arrow-right" />
        </svg>
      {% endif %}
    </button>
  </form>
</details>
