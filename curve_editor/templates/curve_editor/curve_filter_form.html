{% load crispy_forms_tags %}
{% load static %}

<details class="curve-filter-details" open>
  <summary>
    <h3 class="d-inline-block h5 mb-3">
      <span>Dataset filter</span>
      <svg width="24" height="24" fill="currentColor" class="me-1">
        <use xlink:href="{% static "bootstrap-icons/bootstrap-icons.svg" %}#filter" />
      </svg>
    </h3>
  </summary>
  <form method="post"
        class="curve-filter-form"
        hx-post="{% url 'curve_editor:filter_curves' %}"
        hx-trigger="change"
        hx-swap="outerHTML"
        hx-select="#id_panel_{{ panel }}_row"
        hx-target="#id_panel_{{ panel }}_row"
        hx-include="#id_panel_{{ panel }}_row"
        hx-indicator="#curve-panel-{{ panel }}"
        enctype="multipart/form-data"
        novalidate>
    {% crispy filter_form %}
    <div class="clearfix">
      <button type="button"
              class="btn btn-outline-secondary float-end me-2"
              onclick="copyFilters({{ panel }})">
        {% if panel == 1 %}
          <svg width="16"
               height="16"
               fill="currentColor"
               class="me-1 d-none d-md-inline-block">
            <use xlink:href="{% static "bootstrap-icons/bootstrap-icons.svg" %}#arrow-left" />
          </svg>
          <svg width="16" height="16" fill="currentColor" class="me-1 d-md-none">
            <use xlink:href="{% static "bootstrap-icons/bootstrap-icons.svg" %}#arrow-up" />
          </svg>
        {% endif %}
        Copy filters
        {% if panel == 0 %}
          <svg width="16"
               height="16"
               fill="currentColor"
               class="me-1 d-none d-md-inline-block">
            <use xlink:href="{% static "bootstrap-icons/bootstrap-icons.svg" %}#arrow-right" />
          </svg>
          <svg width="16" height="16" fill="currentColor" class="me-1 d-md-none">
            <use xlink:href="{% static "bootstrap-icons/bootstrap-icons.svg" %}#arrow-down" />
          </svg>
        {% endif %}
      </button>
    </div>
  </form>
</details>
