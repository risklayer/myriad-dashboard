{% load static %}

{% if delete %}
  <span id="pin_button_{% if rename %}rename_{% endif %}{{ index }}-{{ panel }}"
        class="d-none"
        hx-swap-oob="outerHTML"></span>
{% else %}
  <button id="pin_button_{% if rename %}rename_{% endif %}{{ index }}-{{ panel }}"
          class="btn {% if key in pinned_keys and not rename %}btn-outline-danger{% else %}btn-outline-secondary{% endif %} text-nowrap mb-2 {{ class }}"
          hx-post="{% if key in pinned_keys and not rename %}{% url "curve_editor:unpin_curve" %}{% else %}{% url "curve_editor:pin_curve" %}{% endif %}"
          hx-swap="none"
          hx-swap-oob="outerHTML"
          {% if key in pinned_keys and confirm %}hx-confirm="Remove this vulnerability curve from your list?"{% endif %}
          hx-disable-elt
          {% if rename or key not in pinned_keys %}hx-prompt="Enter a meaningful description for this curve:"{% endif %}
          {% if rename %}hx-vals='{"rename":true}'{% endif %}
          hx-include="[name^='curve_panel_selected_']"
          name="key"
          value="{{ key }}"
          title="Save curve for later use">
    <span class="htmx-indicator spinner-border spinner-border-sm me-1"></span>
    <svg width="16" height="16" fill="currentColor" class="me-1">
      {# djlint:off #}
    <use xlink:href="{% static "bootstrap-icons/bootstrap-icons.svg" %}{% if rename %}#pencil{% elif key in pinned_keys %}#pin-fill{% else %}#pin{% endif %}" />
      {# djlint:on #}
    </svg>
    {% if rename %}
      Rename
    {% elif key in pinned_keys %}
      Unpin
    {% else %}
      Pin
    {% endif %}
  </button>
{% endif %}
