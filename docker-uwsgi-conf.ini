[uwsgi]

socket     = /myriad-dashboard/run/uwsgi.sock
chmod-socket = 660
chown-socket = www-data:www-data
chdir      = /myriad-dashboard/
wsgi-file  = myriad-dashboard/wsgi.py

master     = true
processes  = 2
threads    = 2
http-websockets = true

vacuum     = true

plugins    = python3

env        = PYTHONIOENCODING=UTF-8
env        = LANG=en_US.utf8
env        = LC_ALL=en_US.UTF-8
env        = LC_LANG=en_US.UTF-8
