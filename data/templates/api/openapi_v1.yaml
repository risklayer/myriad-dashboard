openapi: 3.0.3
info:
  title: Myriad Dashboard Data Backend API
  version: "0.9"

servers:
  {% for host in hosts %}
  - url: http{% if request.is_secure %}s{% endif %}://{% autoescape off %}{{ host }}{% endautoescape %}/data/api/v1
  {% endfor %}

paths:

  /countries:
    get:
      summary: Get a list of Countries
      responses:
        '200' : {"description" : "success", "content" : { "application/json" : {} } }

  /nuts2areas:
    get:
      summary: Get a list of nuts2areas
      parameters:
        - in: query
          name: bbox
          schema:
            type: string
          description: Optional bbox to limit result in the format of minx,miny,maxx,maxy
          example: 6.315765,49.450941,6.401253,49.502918
        - in: query
          name: country
          schema:
            type: array
            items:
              type: string
          description: Optional country code(s)
      responses:
        '200' : {"description" : "success", "content" : { "application/json" : {} } }

  /nuts2shapes:
    get:
      summary: Get a geojson shapefile
      parameters:
        - in: query
          name: bbox
          schema:
            type: string
          description: Optional bbox to limit result in the format of minx,miny,maxx,maxy
          example: 6.315765,49.450941,6.401253,49.502918
        - in: query
          name: country
          schema:
            type: array
            items:
              type: string
          description: Optional country code(s)
      responses:
        '200' : {"description" : "success", "content" : { "application/json" : {} } }

  /columns:
    get:
      summary: Get a list of available indicators
      parameters:
        - in: query
          name: hazard
          schema:
            type: string
            enum: [{{ col_hazard_options|join:", " }}]
          description: hazard
        - in: query
          name: exposure
          schema:
            type: string
            enum: [{{ col_exposure_filter_options|join:", " }}]
          description: exposure
        - in: query
          name: threshold
          schema:
            type: string
            enum: [{{ col_threshold_filter_options|join:", " }}]
          description: threshold
        - in: query
          name: return_period
          schema:
            type: string
            enum: [{{ col_return_period_filter_options|join:", " }}]
          description: return_period
      responses:
        '200' : {"description" : "success", "content" : { "application/json" : {} } }

  /values:
    get:
      summary: Get values filtered by bbox and indicators
      parameters:
        - in: query
          name: bbox
          schema:
            type: string
          description: Optional bbox to limit result in the format of minx,miny,maxx,maxy
          example: 6.315765,49.450941,6.401253,49.502918
        - in: query
          name: columns
          schema:
            type: string
          description: Optional list of indicators to be used
          example: drought_drr_0.4_POP,drought_drr_0.6_POP,drought_drr_0.8_POP,drought_drr_avg_POP
      responses:
        '200' : {"description" : "success", "content" : { "application/json" : {} } }

  /curves/filter:
    get:
      summary: Filter Curves by multiple Parameters
      parameters:
        - in: query
          name: hazard
          schema:
            type: array
            items:
              type: string
              enum: [{{ hazard_options|join:", " }}]
          description: hazard
        - in: query
          name: quality
          schema:
            type: array
            items:
              type: string
              enum: [{{ quality_options|join:", " }}]
          description: quality
        - in: query
          name: con_description_1
          schema:
            type: array
            items:
              type: string
              enum: [{{ con_description_1_options|join:", " }}]
          description: con_description_1
        - in: query
          name: con_description_2
          schema:
            type: array
            items:
              type: string
              enum: [{{ con_description_2_options|join:", " }}]
          description: con_description_2
        - in: query
          name: con_description_3
          schema:
            type: array
            items:
              type: string
              enum: [{{ con_description_3_options|join:", " }}]
          description: con_description_3
        - in: query
          name: occ_description_1
          schema:
            type: array
            items:
              type: string
              enum: [{{ occ_description_1_options|join:", " }}]
          description: occ_description_1
        - in: query
          name: occ_description_2
          schema:
            type: array
            items:
              type: string
              enum: [{{ occ_description_2_options|join:", " }}]
          description: occ_description_2
        - in: query
          name: occ_description_3
          schema:
            type: array
            items:
              type: string
              enum: [{{ occ_description_3_options|join:", " }}]
          description: occ_description_3
        - in: query
          name: coverage
          schema:
            type: array
            items:
              type: string
              enum: [{{ coverage_options|join:", " }}]
          description: coverage
        - in: query
          name: myriad_sectors_applicable
          schema:
            type: array
            items:
              type: string
              enum: [{{ myriad_sectors_applicable_options|join:", " }}]
          description: myriad_sectors_applicable
        - in: query
          name: countries
          schema:
            type: array
            items:
              type: string
              enum: [{{ countries_options|join:", " }}]
          description: countries

      responses:
        '200' : {"description" : "success", "content" : { "application/json" : {} } }

#  /curve/{key}: