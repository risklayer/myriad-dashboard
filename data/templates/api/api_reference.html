{% extends "layouts/base.html" %}

{% load static %}

{% block title %}
  OpenAPI Reference - {{ block.super }}
{% endblock title %}

{% block head %}
<link rel="stylesheet" href="{% static 'swagger-ui-dist/swagger-ui.css' %}" crossorigin="">
<script src="{% static 'swagger-ui-dist/swagger-ui-bundle.js' %}" crossorigin=""></script>
<script src="{% static 'swagger-ui-dist/swagger-ui-standalone-preset.js' %}" crossorigin=""></script>
{% endblock %}

{% block pagetitle %}
  <div class="d-flex justify-content-between">
      <h1>OpenAPI Reference</h1>
  </div>
{% endblock pagetitle %}

{% block main %}
<div id="swagger-ui" class="card mt-5"></div>

<script>
  window.onload = () => {
    window.ui = SwaggerUIBundle({
      url: 'openapi.yaml',
      dom_id: '#swagger-ui',
    });
  };
</script>
{% endblock main %}
