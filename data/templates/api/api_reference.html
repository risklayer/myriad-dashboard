{% extends "base_public.html" %}

{% load static %}
{% load filters %}

{% block header %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'css/swagger-ui.css' %}" crossorigin="">
<script src="{% static 'js/swagger-ui-bundle.js' %}" crossorigin=""></script>
<script src="{% static 'js/swagger-ui-standalone-preset.js' %}" crossorigin=""></script>
{% endblock %}

{% block mainbody %}
<div id="swagger-ui" class="card mt-5"></div>

<script>
  window.onload = () => {
    window.ui = SwaggerUIBundle({
      url: 'openapi.yaml',
      dom_id: '#swagger-ui',
    });
  };
</script>
{% endblock %}
