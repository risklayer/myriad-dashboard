version: "3.9"
services:
  myriad-dashboard-uwsgi:
    build: .
    volumes:
      - ./docker-volumes/db:/myriad-dashboard/db
      - ./docker-volumes/run:/myriad-dashboard/run
      - ./docker-volumes/www_static_data:/myriad-dashboard/www_static_data
      - ./docker-volumes/media:/myriad-dashboard/media
    env_file:
      - docker.env
