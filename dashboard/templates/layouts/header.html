{% load dashboard %}
{% load static %}

<a xlink:href="{% static "bootstrap-icons/bootstrap-icons.svg" %}#main"
   class="skip-link">Skip to main content</a>
<nav class="navbar navbar-expand-xl" data-bs-theme="dark">
  <div class="container-fluid">
    <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    {% url "home" as home_url %}
    <span class="navbar-brand p-0">
      <a xlink:href="{% static "bootstrap-icons/bootstrap-icons.svg" %}{{ home_url }}">
        <img src="{% static 'img/myriad-logo-white.svg' %}"
             alt="MYRIAD-EU: Reducing risks together"
             height="40"
             width="90" />
      </a>
      <small class="mx-1"><strong>beta</strong></small>
    </span>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav w-100 me-auto mb-2 mb-md-0">
        <li class="nav-item">
          <a href="{{ home_url }}"
             class="nav-link{% if request.path == home_url %} active{% endif %}"
             {% if request.path == home_url %}aria-current="page"{% endif %}>
            Home
          </a>
        </li>
        {% dashboard_header_apps %}
        <li class="nav-item dropdown ms-xl-auto ms-xxxl-0">
          <button class="btn btn-link nav-link py-2 px-0 px-xl-2 d-flex align-items-center"
                  hx-get="{% static "js/oss-licenses.html" %}"
                  hx-target="#modal-body"
                  hx-swap="innerHTML"
                  aria-pressed="false"
                  data-bs-toggle="modal"
                  data-bs-target="#main-modal"
                  title="Open Source Software Licenses">
            <span class="d-xl-none d-xxxl-block">OSS Licenses</span>
            {% include "shared/icon.html" with type="file-earmark-code" class="my-1 d-none d-xl-block d-xxxl-none" %}
          </button>
        </li>
        <li class="nav-item dropdown ms-xxxl-auto">
          <button class="btn btn-link nav-link py-2 px-0 px-xl-2 dropdown-toggle d-flex align-items-center"
                  id="bd-theme"
                  type="button"
                  aria-expanded="false"
                  data-bs-toggle="dropdown"
                  data-bs-display="static"
                  aria-label="Toggle theme (auto)">
            {% include "shared/icon.html" with type="circle-half" class="my-1 theme-icon-active" %}
            <span class="d-xl-none ms-2" id="bd-theme-text">Toggle theme</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end"
              aria-labelledby="bd-theme-text">
            <li>
              <button type="button"
                      class="dropdown-item d-flex align-items-center"
                      data-bs-theme-value="light"
                      aria-pressed="false">
                {% include "shared/icon.html" with type="sun-fill" class="me-2 opacity-50" %}
                Light
                {% include "shared/icon.html" with type="check2" class="ms-auto d-none" %}
              </button>
            </li>
            <li>
              <button type="button"
                      class="dropdown-item d-flex align-items-center"
                      data-bs-theme-value="dark"
                      aria-pressed="false">
                {% include "shared/icon.html" with type="moon-stars-fill" class="me-2 opacity-50" %}
                Dark
                {% include "shared/icon.html" with type="check2" class="ms-auto d-none" %}
              </button>
            </li>
            <li>
              <button type="button"
                      class="dropdown-item d-flex align-items-center active"
                      data-bs-theme-value="auto"
                      aria-pressed="true">
                {% include "shared/icon.html" with type="circle-half" class="me-2 opacity-50" %}
                Auto
                {% include "shared/icon.html" with type="check2" class="ms-auto d-none" %}
              </button>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
<div id="main-modal" class="modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h1 id="modal-title" class="modal-title"></h1>
        <button type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"></button>
      </div>
      <div class="modal-body htmx-indicator" id="modal-body"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Close
        </button>
      </div>
    </div>
  </div>
</div>
