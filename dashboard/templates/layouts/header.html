{% load dashboard %}
{% load static %}
<a href="#main" class="skip-link">Skip to main content</a>
<nav class="navbar navbar-expand-md" data-bs-theme="dark">
  <div class="container-fluid">
    <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    {% url "home" as home_url %}
    <span class="navbar-brand p-0">
      <a href="{{ home_url }}">
        <img src="{% static 'img/myriad-logo-white.svg' %}"
             alt="MYRIAD EU: Reducing risks together"
             height="40">
      </a>
    </span>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-md-0">
        <li class="nav-item">
          <a class="nav-link{% if request.path == home_url %} active{% endif %}"
             {% if request.path == home_url %}aria-current="page"{% endif %}
             href="{{ home_url }}">Home</a>
        </li>
        {% dashboard_header_apps %}
      </ul>
    </div>
  </div>
</nav>
