{% load filters %}

<li data-value="{{ key }}"
    class="list-group-item d-flex gap-1 align-items-start">
  <div class="col-10">
    <div id="table-dataset-list-title-{{ key|slugify }}">
      <b class="pin-label pin-label-{{ key|slugify }}">
        {{ pin_label }}
      </b>
      <div>{{ label }}</div>
    </div>
  </div>
  <div class="btn-group-vertical col-2">
    {% include "shared/add_to_table_button.html" with key=key label=label compact=True class="btn-sm p-1" icon="trash" add_to_table_text="Remove from combined events" toggle=False only %}
  </div>
</li>
