{% extends "layouts/base.html" %}

{% load static %}

{% block title %}
  Boilerplate - {{ block.super }}
{% endblock title %}

{% block head %}
  {{ block.super }}
  <style>
      .htmx-indicator~* {
          transition: opacity 0.1s ease;
      }

      .htmx-indicator.htmx-request~* {
          transition: opacity 0.2s ease;
      }

      .htmx-request~* {
          opacity: 0.4;
      }
  </style>
{% endblock head %}

{% block pagetitle %}
  <div class="d-flex justify-content-between">
    <h1>Boilerplate</h1>
    <div class="float-end"></div>
  </div>
{% endblock pagetitle %}

{% block mainbody %}
  <div class="row g-3"></div>
  <script src="{% static "boilerplate/js/boilerplate.js" %}"></script>
{% endblock mainbody %}
